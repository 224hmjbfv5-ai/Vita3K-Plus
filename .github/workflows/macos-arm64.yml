
name: Vita3K Plus macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake molten-vk openssl qt boost

      - name: Configure project
        run: |
          cmake --preset macos-xcode

      - name: Build Release
        run: |
          cmake --build build/macos-xcode \
            --config Release --parallel 3

      - name: Package application
        run: |
          set -e
          APP="$(find build/macos-xcode \
            -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "No .app bundle found."
            echo "Inspect the build output before packaging."
            find build/macos-xcode -maxdepth 4 -type f \
              -perm -111 -print | head -100
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" Vita3K-Plus-macOS-arm64.zip

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Plus-macOS-arm64
          path: Vita3K-Plus-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
