name: Vita3K Plus macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: nckstwrt/Vita3K-Plus
          ref: all-enhancements
          submodules: recursive
          
      - name: Patch ATRAC9 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vita3k/codec/src/atrac9.cpp")
          source = path.read_text()

          old = "Atrac9DecodeBounded(decoder_handle, data, superframe_data_left, reinterpret_cast<short *>(result.data()), &decode_used)"
          new = "Atrac9Decode(decoder_handle, data, reinterpret_cast<short *>(result.data()), &decode_used)"

          if old not in source:
              raise SystemExit("Expected ATRAC9 call not found")

          path.write_text(source.replace(old, new, 1))
          print("ATRAC9 compatibility patch applied")
          PY
          
      - name: Generate fork build metadata
        shell: bash
        run: |
          mkdir -p vita3k/util/include/util
          cat > vita3k/util/include/util/fork_build.h <<'EOF'
          #pragma once
          #define FORK_BUILD_SEQ "macOS-ARM64-CI"
          #define FORK_BUILD_CHANGES "GitHub Actions build"
          EOF

      - name: Install dependencies
        run: |
          brew update
          brew install cmake molten-vk openssl qt boost

      - name: Configure project
        run: |
          cmake --preset macos-xcode
          
      - name: Patch ATRAC9 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vita3k/codec/src/atrac9.cpp")
          source = path.read_text()

          old = "Atrac9DecodeBounded(decoder_handle, data, superframe_data_left, reinterpret_cast<short *>(result.data()), &decode_used)"
          new = "Atrac9Decode(decoder_handle, data, reinterpret_cast<short *>(result.data()), &decode_used)"

          if old not in source:
              raise SystemExit("Expected ATRAC9 call not found")

          path.write_text(source.replace(old, new, 1))
          print("ATRAC9 compatibility patch applied")
          PY

      - name: Build Release
        run: |
          cmake --build build/macos-xcode \
            --config Release --parallel 3

      - name: Package application
        run: |
          set -e
          APP="$(find build/macos-xcode \
            -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "No .app bundle found."
            find build/macos-xcode -maxdepth 4 -type f \
              -perm -111 -print | head -100
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" Vita3K-Plus-macOS-arm64.zip

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Plus-macOS-arm64
          path: Vita3K-Plus-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
